<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="tau-title tau-desc">
  <title id="tau-title">oh-my-tau banner</title>
  <desc id="tau-desc">A dark banner with an orange lowercase tau mark, the monospace wordmark "oh-my-tau", the subtitle "Familiar tools. Shared context.", and a small diagram of one lead node branching to two independent nodes.</desc>
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="#0e1118" stroke="#29303b" stroke-width="2"/>
  <!-- lowercase tau mark: horizontal top bar with a stem curving right at the base -->
  <path d="M86 116 H176 M131 116 V178 Q131 206 162 202" fill="none" stroke="#f97316" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- divider -->
  <line x1="240" y1="72" x2="240" y2="248" stroke="#29303b" stroke-width="2"/>
  <!-- wordmark -->
  <text x="282" y="172" font-family="'JetBrains Mono','SF Mono',Consolas,Menlo,monospace" font-size="80" font-weight="600" fill="#e8eaf0" letter-spacing="1">oh-my-tau</text>
  <text x="284" y="228" font-family="'JetBrains Mono','SF Mono',Consolas,Menlo,monospace" font-size="24" fill="#8b94a3" letter-spacing="0.5">Familiar tools. Shared context.</text>
  <!-- one lead, two independent branches -->
  <path d="M962 160 C 1005 160 1028 118 1068 112" fill="none" stroke="#3a4454" stroke-width="2.5"/>
  <path d="M962 160 C 1005 160 1028 202 1068 208" fill="none" stroke="#3a4454" stroke-width="2.5"/>
  <circle cx="950" cy="160" r="12" fill="#f97316"/>
  <circle cx="1080" cy="110" r="9" fill="#0e1118" stroke="#e8eaf0" stroke-width="2.5"/>
  <circle cx="1080" cy="210" r="9" fill="#0e1118" stroke="#e8eaf0" stroke-width="2.5"/>
</svg>
